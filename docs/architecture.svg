<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">SwarmOps platform architecture</title><desc id="d">Engineering topology of SwarmOps, a drone-fleet mission planning platform. Delivery: GitHub Actions verifies each service on pull requests; on main it authenticates to AWS through OIDC with no static keys, pushes the image to Amazon ECR with immutable tags, and bumps that service's image tag in a GitOps deployments repo. Argo CD watches that repo and syncs a Helm parent chart to Amazon EKS with auto-sync, self-heal and prune. In the cluster, an ALB Ingress fronts an NGINX gateway that routes to frontend, auth, mission, fleet, telemetry, notification and planning services. The planning service runs as five replicas under an Argo Rollouts canary gated on Prometheus metrics. A drone simulator feeds telemetry; telemetry publishes events to RabbitMQ, consumed by fleet, notification and planning. MongoDB holds one logical database per service. Observability: Prometheus with ServiceMonitors and Alertmanager rules, Loki with Grafana Alloy for logs, and a Grafana dashboard.</desc><style>
